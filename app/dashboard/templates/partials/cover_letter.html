<div class="card" style="border-color: var(--accent);">
    <h2 style="color: var(--accent);">Cover Letter</h2>
    <div class="detail-description" style="white-space: pre-wrap;">{{ cover_letter }}</div>
    <div style="margin-top: 1rem; display: flex; justify-content: space-between; align-items: center;">
        <span style="color: var(--text-muted); font-size: 0.8rem;">
            Generated by {{ model }} | Cost: {{ cost }}
        </span>
        <button class="btn btn-ghost btn-sm" onclick="navigator.clipboard.writeText(document.querySelector('.detail-description').innerText).then(() => this.innerText = 'Copied!')">
            Copy to clipboard
        </button>
    </div>
</div>
