# config/boards.yaml — Per-board scraper configuration
# Each board gets its own scraping params and rate-limit settings.
#
# Shared values (location, search_queries, radius) are inherited from
# profile.yaml by default. You can override them per-board if needed.
# If a field is omitted or empty, the profile value is used.

boards:
  indeed:
    enabled: true
    module: "app.scrapers.indeed"
    base_url: "https://www.indeed.com"
    # search_queries: inherited from profile.target_roles (lowercased)
    # location: inherited from profile.preferences.location
    # radius_miles: inherited from profile.preferences.max_commute_miles
    max_pages: 3
    delay_min: 10.0
    delay_max: 30.0
    headers:
      Accept-Language: "en-US,en;q=0.9"

  linkedin:
    enabled: true
    module: "app.scrapers.linkedin"
    base_url: "https://www.linkedin.com"
    # search_queries: inherited from profile.target_roles (lowercased)
    # location: inherited from profile.preferences.location
    # radius_miles: inherited from profile.preferences.max_commute_miles
    max_pages: 3
    delay_min: 15.0        # LinkedIn is aggressive — stay slow
    delay_max: 40.0
    headers:
      Accept-Language: "en-US,en;q=0.9"

  dice:
    enabled: true
    module: "app.scrapers.dice"
    base_url: "https://www.dice.com"
    # search_queries: inherited from profile.target_roles (lowercased)
    # location: inherited from profile.preferences.location
    # radius_miles: inherited from profile.preferences.max_commute_miles
    max_pages: 3
    delay_min: 10.0
    delay_max: 25.0
    headers:
      Accept-Language: "en-US,en;q=0.9"

  usajobs:
    enabled: true
    module: "app.scrapers.usajobs"
    base_url: "https://data.usajobs.gov"
    # search_queries: inherited from profile.target_roles (lowercased)
    # location: inherited from profile.preferences.location
    # radius_miles: inherited from profile.preferences.max_commute_miles
    max_pages: 2                   # API returns 50/page, 2 pages = 100 per query
    delay_min: 2.0                 # Official API — no need to be slow
    delay_max: 5.0
    headers:
      # REQUIRED: Get your API key at https://developer.usajobs.gov/APIRequest/Index
      Authorization-Key: "gl+MVXOcmu5LnsKcZfHSan7AncYVk+IsIkA/Xma2YI8="
      # REQUIRED: Your email address (used as User-Agent for API tracking)
      User-Agent: "jjones@mansa-tech.com"
 